<!-- English - Latin Translator -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
body {
    font-family: monospace;
    background-color: rgb(25, 25, 25);
    color: rgb(128, 0, 0);
    text-align: center;
}

textarea {
    background-color: rgb(50, 50, 50);
    border: 1px solid rgb(100, 100, 100);
    margin: 10px;
    padding: 10px;
}

#english {
    color: rgb(255, 135, 0);
}

#latin {
    color: rgb(0, 165, 255);
}

button {
    background-color: rgb(128, 0, 0);
    color: white;
    border: none;
    padding: 10px 15px;
    margin: 5px;
    cursor: pointer;
}

button:hover {
    background-color: rgb(180, 0, 0);
}
</style>

</head>

<body>

<h1>TRANSLATOR LATINUS</h1>

<h3 id="mode">English → Latin</h3>

<textarea
    id="english"
    rows="10"
    cols="35"
    placeholder="Enter text here..."
></textarea>

<br>

<button onclick="translateText()">
    Translate
</button>

<button onclick="swapLanguages()">
    Swap Languages
</button>

<br>

<textarea
    id="latin"
    rows="10"
    cols="35"
    readonly
    placeholder="Translation appears here..."
></textarea>

<script>

let direction = "en|la";

async function translateText() {

    const input = document.getElementById("english");
    const output = document.getElementById("latin");

    const text = input.value.trim();

    if (!text) {
        output.value = "";
        return;
    }

    output.value = "Translating...";

    try {

        const response = await fetch(
            `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${direction}`
        );

        const data = await response.json();

        output.value = data.responseData.translatedText;

    } catch (error) {

        output.value = "Translation failed.";

        console.error(error);

    }
}

function swapLanguages() {

    const input = document.getElementById("english");
    const output = document.getElementById("latin");
    const mode = document.getElementById("mode");

    [input.value, output.value] =
    [output.value, input.value];

    direction =
        direction === "en|la"
        ? "la|en"
        : "en|la";

    mode.textContent =
        direction === "en|la"
        ? "English → Latin"
        : "Latin → English";
}

</script>

</body>
</html>
